---
name: Set up Python environment
description: >
  Installs a project-local Python 3.12 using uv and creates a virtual environment
  on PATH, so the job does not depend on the runner's tool cache or on sudo.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        set -euo pipefail
        if python3 -m pip --version >/dev/null 2>&1; then
          python3 -m pip install --user --upgrade --quiet uv
        else
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Show runner environment
      shell: bash
      run: |
        echo "$(grep PRETTY_NAME /etc/os-release | cut -d= -f2), $(ldd --version 2>&1 | head -1), $(uv --version)"
        df -h "$GITHUB_WORKSPACE" | tail -1

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      env:
        # The runners are Oracle Linux 9 (glibc). uv's automatic libc detection fails
        # there, so tell it explicitly which flavour of standalone build to fetch.
        UV_LIBC: gnu
      run: |
        set -euo pipefail
        uv python install "${{ inputs.python-version }}"

    - name: Create virtual environment
      shell: bash
      env:
        UV_LIBC: gnu
      run: |
        set -euo pipefail
        uv venv --seed --python "${{ inputs.python-version }}" "$GITHUB_WORKSPACE/.venv"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        python_location="$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'import sys; print(sys.base_prefix)')"
        echo "pythonLocation=$python_location" >> "$GITHUB_ENV"
        # /tmp on the runners refuses reads of files pip has just written there, which
        # breaks isolated builds of source packages. Use the runner's own temp area instead.
        echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/.venv/bin/python" --version

    - name: Point uv at the runner's package index
      shell: bash
      run: |
        set -euo pipefail
        # The runners carry a pip.conf for an internal mirror with its own CA.
        # uv does not read pip.conf, so pass the same settings through.
        index_url="$(pip config get global.index-url 2>/dev/null || true)"
        if [ -n "$index_url" ]; then
          echo "UV_INDEX_URL=$index_url" >> "$GITHUB_ENV"
          echo "Using package index $index_url"
        fi
        cert="$(pip config get global.cert 2>/dev/null || true)"
        if [ -n "$cert" ]; then
          echo "SSL_CERT_FILE=$cert" >> "$GITHUB_ENV"
        fi
        echo "UV_NATIVE_TLS=true" >> "$GITHUB_ENV"
