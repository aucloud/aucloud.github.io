---
name: Set up Python environment
description: >
  Installs a project-local Python 3.12 using uv and creates a virtual environment
  on PATH, so the job does not depend on the runner's tool cache or on sudo.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        set -euo pipefail
        if python3 -m pip --version >/dev/null 2>&1; then
          python3 -m pip install --user --upgrade --quiet uv
        else
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Show runner environment
      shell: bash
      run: |
        set +e
        echo "::group::Runner environment"
        uname -a
        cat /etc/os-release 2>/dev/null
        echo "ldd: $(command -v ldd || echo missing)"; ldd --version 2>&1 | head -1
        ls -l /lib64/ld-linux* /lib/ld-linux* /lib/ld-musl* /usr/lib64/ld-linux* 2>/dev/null
        echo "python3: $(command -v python3 || echo missing)"; python3 --version 2>&1
        python3 -m pip --version 2>&1
        uv --version
        df -h "$HOME" "$GITHUB_WORKSPACE"
        echo "::endgroup::"

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: |
        set -uo pipefail
        # Prefer a managed download so every runner gets the same interpreter.
        # If uv cannot identify the platform, fall back to the runner's system python3.
        if uv python install -v "${{ inputs.python-version }}"; then
          echo "PYTHON_FOR_VENV=${{ inputs.python-version }}" >> "$GITHUB_ENV"
        else
          echo "::warning::uv could not install a managed Python; falling back to system python3"
          command -v python3 >/dev/null || { echo "::error::no python3 on this runner"; exit 1; }
          echo "PYTHON_FOR_VENV=$(command -v python3)" >> "$GITHUB_ENV"
        fi

    - name: Create virtual environment
      shell: bash
      run: |
        set -euo pipefail
        uv venv --seed --python "$PYTHON_FOR_VENV" "$GITHUB_WORKSPACE/.venv"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        python_location="$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'import sys; print(sys.base_prefix)')"
        echo "pythonLocation=$python_location" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/.venv/bin/python" --version
