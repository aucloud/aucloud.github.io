---
name: Set up Python environment
description: >
  Installs a project-local Python 3.12 using uv and creates a virtual environment
  on PATH, so the job does not depend on the runner's tool cache or on sudo.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        set -euo pipefail
        if python3 -m pip --version >/dev/null 2>&1; then
          python3 -m pip install --user --upgrade --quiet uv
        else
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Show runner environment
      shell: bash
      run: |
        set +e
        echo "::group::Runner environment"
        uname -a
        grep PRETTY_NAME /etc/os-release 2>/dev/null
        ldd --version 2>&1 | head -1
        file /bin/sh 2>&1
        /lib64/ld-linux-x86-64.so.2 --version 2>&1 | head -1
        echo "python3: $(command -v python3 || echo missing) $(python3 --version 2>&1)"
        uv --version
        df -h "$HOME" "$GITHUB_WORKSPACE"
        echo "::endgroup::"

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      env:
        # The runners are Oracle Linux 9 (glibc). uv's automatic libc detection fails
        # there, so tell it explicitly which flavour of standalone build to fetch.
        UV_LIBC: gnu
      run: |
        set -uo pipefail
        if ! uv python install "${{ inputs.python-version }}"; then
          echo "::group::uv trace without UV_LIBC override"
          env -u UV_LIBC uv python install -vv "${{ inputs.python-version }}" 2>&1 | grep -i "libc\|ld\.so\|ld path\|glibc\|musl" | head -20
          echo "::endgroup::"
          echo "::error::uv could not install a managed Python ${{ inputs.python-version }}"
          exit 1
        fi
        uv python find "${{ inputs.python-version }}"

    - name: Create virtual environment
      shell: bash
      env:
        UV_LIBC: gnu
      run: |
        set -euo pipefail
        uv venv --seed --python "${{ inputs.python-version }}" "$GITHUB_WORKSPACE/.venv"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        python_location="$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'import sys; print(sys.base_prefix)')"
        echo "pythonLocation=$python_location" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/.venv/bin/python" --version
