---
name: Set up Python environment
description: >
  Installs a project-local Python 3.12 using uv and creates a virtual environment
  on PATH, so the job does not depend on the runner's tool cache or on sudo.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        set -euo pipefail
        # The standalone installer works on every runner image. Newer system Pythons
        # refuse user-level pip installs (PEP 668), so pip is only the fallback.
        if ! curl -LsSf https://astral.sh/uv/install.sh | sh; then
          python3 -m pip install --user --upgrade --quiet uv
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Show runner environment
      shell: bash
      run: |
        echo "$(grep PRETTY_NAME /etc/os-release | cut -d= -f2), $(ldd --version 2>&1 | head -1), $(uv --version)"
        df -h "$GITHUB_WORKSPACE" | tail -1

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      env:
        # The runners are Oracle Linux 9 (glibc). uv's automatic libc detection fails
        # there, so tell it explicitly which flavour of standalone build to fetch.
        UV_LIBC: gnu
      run: |
        set -euo pipefail
        uv python install "${{ inputs.python-version }}"

    - name: Create virtual environment
      shell: bash
      env:
        UV_LIBC: gnu
      run: |
        set -euo pipefail
        uv venv --seed --python "${{ inputs.python-version }}" "$GITHUB_WORKSPACE/.venv"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
        python_location="$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'import sys; print(sys.base_prefix)')"
        echo "pythonLocation=$python_location" >> "$GITHUB_ENV"
        # /tmp on the runners refuses reads of files pip has just written there, which
        # breaks isolated builds of source packages. Use the runner's own temp area instead.
        echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
        "$GITHUB_WORKSPACE/.venv/bin/python" --version

    - name: Point uv at the runner's package index
      shell: bash
      run: |
        set -euo pipefail
        # The runners carry a pip.conf for an internal mirror with its own CA.
        # uv does not read pip.conf, so pass the same settings through.
        index_url="$(pip config get global.index-url 2>/dev/null || true)"
        if [ -n "$index_url" ]; then
          echo "UV_INDEX_URL=$index_url" >> "$GITHUB_ENV"
          echo "Using package index $index_url"
        fi
        cert="$(pip config get global.cert 2>/dev/null || true)"
        if [ -n "$cert" ]; then
          echo "SSL_CERT_FILE=$cert" >> "$GITHUB_ENV"
        fi
        echo "UV_NATIVE_TLS=true" >> "$GITHUB_ENV"

    - name: Install cairo for social cards
      shell: bash
      run: |
        set -euo pipefail
        # The mkdocs social plugin needs the cairo C library, which the runner image
        # does not ship and the runner user cannot install with the package manager.
        # Fetch it from conda-forge into the job's temp area with micromamba instead.
        mamba_root="$RUNNER_TEMP/micromamba"
        prefix="$RUNNER_TEMP/cairo"
        mkdir -p "$mamba_root/bin"
        curl -Ls -o "$mamba_root/bin/micromamba" \
          https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
        chmod +x "$mamba_root/bin/micromamba"
        MAMBA_ROOT_PREFIX="$mamba_root" "$mamba_root/bin/micromamba" create -y -q -p "$prefix" -c conda-forge cairo
        lib_path="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        echo "LD_LIBRARY_PATH=$lib_path" >> "$GITHUB_ENV"
        LD_LIBRARY_PATH="$lib_path" python -c "import ctypes; ctypes.CDLL('libcairo.so.2'); print('cairo library loads')"
